# Fly.io app config for the FastAPI backend.
# Deploy from the backend/ directory. First time: `fly apps create <name>`,
# then `fly deploy` (this reuses this checked-in file — no need for the
# interactive `fly launch` wizard). App name must be globally unique on Fly —
# change it below before creating the app. See ../DEPLOY.md for full steps.
app = "statement-analyzer-api"
primary_region = "iad"

[build]

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
